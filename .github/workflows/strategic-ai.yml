name: Strategic Reasoning AI - train and benchmark
on:
  push:
    paths:
      - 'tools/strategic-ai/**'
      - '.github/workflows/strategic-ai.yml'
  pull_request:
    paths:
      - 'tools/strategic-ai/**'
      - '.github/workflows/strategic-ai.yml'
  workflow_dispatch:
    inputs:
      episodes:
        description: Number of Q-learning episodes (50-100000)
        required: false
        default: '500'
      simulations:
        description: MCTS simulations per decision (8-5000)
        required: false
        default: '96'
  schedule:
    - cron: '21 3 * * 1'
permissions:
  contents: read
jobs:
  train-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONHASHSEED: '0'
    defaults:
      run:
        working-directory: tools/strategic-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/strategic-ai/requirements.txt
      - name: Install training dependency
        run: python -m pip install -r requirements.txt
      - name: Test tree search, learning and benchmark families
        run: python -m unittest discover -s tests -v
      - name: Set bounded training budget
        id: cfg
        shell: bash
        run: |
          ep='${{ github.event.inputs.episodes || '500' }}'
          sim='${{ github.event.inputs.simulations || '96' }}'
          if [[ '${{ github.event_name }}' == 'schedule' ]]; then ep=350; sim=64; fi
          [[ "$ep" =~ ^[0-9]+$ ]] && (( ep >= 50 && ep <= 100000 )) || { echo 'invalid episodes'; exit 2; }
          [[ "$sim" =~ ^[0-9]+$ ]] && (( sim >= 8 && sim <= 5000 )) || { echo 'invalid simulations'; exit 2; }
          echo "episodes=$ep" >> "$GITHUB_OUTPUT"
          echo "simulations=$sim" >> "$GITHUB_OUTPUT"
      - name: Train grid policy and distill MCTS search targets
        run: |
          python train.py --episodes '${{ steps.cfg.outputs.episodes }}' --eval-episodes 20 --simulations '${{ steps.cfg.outputs.simulations }}' --horizon 18 --seed 410 --out artifacts/strategic_policy.json --metrics artifacts/metrics.json
          python - <<'PY'
          import json, math
          from pathlib import Path
          m=json.loads(Path('artifacts/metrics.json').read_text())
          assert m['training']['updates'] > 0
          assert Path('artifacts/strategic_policy.json').stat().st_size > 100
          assert Path('artifacts/strategic_neural.json').stat().st_size > 100
          assert m['neural_distillation']['parameters'] > 1000
          assert m['neural_distillation']['search_target_states'] >= 20
          assert math.isfinite(m['neural_distillation']['final_validation_mse'])
          for section in ('held_out_random_policy','held_out_learned_policy','held_out_neural_policy','held_out_mcts_policy'):
              s=m[section]
              assert 0 <= s['success_rate'] <= 1
              assert math.isfinite(s['mean_return'])
          print('Grid checkpoints and MCTS-generated neural targets passed integrity checks.')
          PY
      - name: Train cross-domain evaluator and validate held-out task families
        run: |
          python train_general.py --seed 410 --epochs 25 --fold-epochs 8 --episodes-per-family 3 --target-simulations 16 --eval-simulations 24 --target-horizon 8 --eval-horizon 8 --fold-eval-episodes 2 --out artifacts/strategic_general_neural.json --metrics artifacts/general_metrics.json
          python - <<'PY'
          import json, math
          from pathlib import Path
          model=Path('artifacts/strategic_general_neural.json')
          m=json.loads(Path('artifacts/general_metrics.json').read_text())
          assert model.stat().st_size > 1000
          assert m['training']['target_generation']['unique_target_states'] >= 30
          assert m['training']['neural_distillation']['validation_mse_improved']
          assert len(m['leave_one_family_out']) == 4
          assert m['acceptance']['all_metrics_finite']
          assert m['acceptance']['promote_candidate'], 'held-out regression gate rejected candidate'
          for family in ('resource_allocation','scheduling','route_planning','adversarial'):
              metrics=m['held_out_scenarios'][family]
              for method in ('search_only','neural_only','hybrid'):
                  assert 0 <= metrics[method]['success_rate'] <= 1
                  assert math.isfinite(metrics[method]['mean_return'])
          print('Cross-domain checkpoint passed seeded and leave-one-family-out gates.')
          print('Held-out scope:', m['validation_scope'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: strategic-ai-v2-${{ github.run_number }}
          path: |
            tools/strategic-ai/artifacts/strategic_policy.json
            tools/strategic-ai/artifacts/strategic_neural.json
            tools/strategic-ai/artifacts/strategic_general_neural.json
            tools/strategic-ai/artifacts/metrics.json
            tools/strategic-ai/artifacts/general_metrics.json
          if-no-files-found: error
          retention-days: 30
